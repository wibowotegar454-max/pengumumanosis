<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem E-Voting OSIS SMANIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#030712',
                        glassBg: 'rgba(17, 24, 39, 0.7)',
                        glassBorder: 'rgba(255, 255, 255, 0.1)',
                        neonCyan: '#00F0FF',
                        neonBlue: '#2563EB',
                        gold: '#FBBF24'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    animation: {
                        'glow-pulse': 'glowPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        glowPulse: {
                            '0%, 100%': { opacity: 1, filter: 'drop-shadow(0 0 10px rgba(0, 240, 255, 0.5))' },
                            '50%': { opacity: 0.5, filter: 'drop-shadow(0 0 2px rgba(0, 240, 255, 0.2))' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #030712;
            color: #E5E7EB;
        }
        h1, h2, h3, h4, h5, h6, .font-display { font-family: 'Outfit', sans-serif; }
        
        .bg-cyberpunk {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: radial-gradient(circle at top right, rgba(37, 99, 235, 0.15), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(0, 240, 255, 0.1), transparent 40%);
            background-color: #030712;
        }
        
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; border: 2px solid #0f172a; }
        ::-webkit-scrollbar-thumb:hover { background: #00F0FF; }

        .glass-card {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        .glow-border:focus-within {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            border-color: rgba(0, 240, 255, 0.6);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative overflow-x-hidden">

    <div class="bg-cyberpunk"></div>
    <div class="bg-grid"></div>

    <nav class="glass-card sticky top-0 z-40 border-b border-glassBorder/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center space-x-4">
                    <div class="relative w-12 h-12 flex-shrink-0 animate-float">
                        <div class="absolute inset-0 bg-neonCyan rounded-full blur-md opacity-30"></div>
                        <img src="logo.jpg" alt="Logo SMANIS" class="relative w-full h-full object-cover rounded-full drop-shadow-lg z-10 border border-neonCyan/40" onerror="this.src='https://placehold.co/100x100/0f172a/00F0FF?text=OSIS'">
                    </div>
                    <div>
                        <span class="font-display font-bold text-2xl tracking-wider text-white drop-shadow-[0_0_8px_rgba(255,255,255,0.5)]">DIGI-VOTE OSIS</span>
                        <p class="text-[10px] text-neonCyan font-mono tracking-widest uppercase">PEMILIHAN KETUA & WAKIL KETUA OSIS</p>
                    </div>
                </div>
                <div id="nav-actions" class="flex items-center space-x-4"></div>
            </div>
        </div>
    </nav>

    <main id="app-container" class="flex-grow flex items-center justify-center p-4 relative z-10">
        <!-- Dynamic views -->
    </main>

    <footer class="glass-card mt-auto py-6 text-center text-sm border-t border-glassBorder text-gray-400">
        <p class="font-display tracking-wide">&copy; <span id="year"></span> MPK/OSIS SMA Negeri 1 Sumberejo.</p>
        <p class="mt-1 text-xs text-gray-500 font-mono">Quantum Core V2.0 | Encrypted Connection Simulation</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        lucide.createIcons();

        Chart.defaults.color = '#94a3b8';
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(15, 23, 42, 0.9)';
        Chart.defaults.plugins.tooltip.titleColor = '#fff';

        const initialCandidates = [
            {
                id: 1, number: "01", chairman: "Tegar Wibowo", viceChairman: "Alya Salsabila",
                slogan: "Cerdas, Kreatif, dan Berakhlak Mulia", photo: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=60",
                vision: "Menjadikan OSIS sebagai wadah aspirasi dan pengembangan kreativitas siswa.",
                mission: ["Mengadakan kegiatan ekstrakurikuler yang inovatif.", "Meningkatkan kedisiplinan."]
            },
            {
                id: 2, number: "02", chairman: "Andi Permana", viceChairman: "Siti Rahma",
                slogan: "Inovasi untuk Prestasi", photo: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=500&auto=format&fit=crop&q=60",
                vision: "Mewujudkan lingkungan sekolah yang kompetitif dalam prestasi.",
                mission: ["Mengoptimalkan peran mading.", "Menyelenggarakan tryout rutin."]
            },
            {
                id: 3, number: "03", chairman: "Rizky Firmansyah", viceChairman: "Dewi Lestari",
                slogan: "Bersama Membangun Karakter Bangsa", photo: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=500&auto=format&fit=crop&q=60",
                vision: "Membentuk siswa yang berkarakter kuat dan peduli lingkungan.",
                mission: ["Program Jumat Bersih.", "Pelatihan literasi digital."]
            },
            {
                id: 4, number: "04", chairman: "Tariq Halilintar", viceChairman: "Nabila Putri",
                slogan: "Muda, Beda, dan Berprestasi", photo: "https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=500&auto=format&fit=crop&q=60",
                vision: "Menjadikan siswa-siswi unggul dalam berwirausaha.",
                mission: ["Workshop kewirausahaan.", "Pemanfaatan media sosial positif."]
            }
        ];

        const initialVoters = [
            { nis: "4979", role: "siswa", hasVoted: false },
            { token: "QRGURU-001", role: "guru", name: "Pak Budi, S.Pd", hasVoted: false },
            { username: "admin", pin: "admin123", role: "admin" }
        ];

        // Force reset or initialize DPT to ensure 4979 is active immediately
        if (!localStorage.getItem('evote_candidates')) localStorage.setItem('evote_candidates', JSON.stringify(initialCandidates));
        
        let storedVoters = JSON.parse(localStorage.getItem('evote_voters') || '[]');
        if (!storedVoters.some(v => v.nis === "4979")) {
            localStorage.setItem('evote_voters', JSON.stringify(initialVoters));
        }

        if (!localStorage.getItem('evote_results')) localStorage.setItem('evote_results', JSON.stringify({ "1": 45, "2": 30, "3": 15, "4": 10 })); 
        if (!localStorage.getItem('evote_status')) localStorage.setItem('evote_status', 'open');

        let currentUser = null;
        const appContainer = document.getElementById('app-container');
        const navActions = document.getElementById('nav-actions');

        const getCandidates = () => JSON.parse(localStorage.getItem('evote_candidates'));
        const getVoters = () => JSON.parse(localStorage.getItem('evote_voters'));
        const getResults = () => JSON.parse(localStorage.getItem('evote_results'));
        const getStatus = () => localStorage.getItem('evote_status');

        function renderView(viewName, data = null) {
            appContainer.innerHTML = ''; 
            navActions.innerHTML = '';   
            
            if (viewName === 'login') renderLogin();
            else if (viewName === 'voting') renderVoting();
            else if (viewName === 'success') renderSuccess(data);
            else if (viewName === 'admin') renderAdmin();
            else if (viewName === 'already_voted') renderAlreadyVoted();
        }

        function renderLogin() {
            appContainer.innerHTML = `
                <div class="glass-card p-8 rounded-3xl shadow-2xl w-full max-w-md fade-in relative overflow-hidden group">
                    <div class="absolute -top-20 -right-20 w-40 h-40 bg-neonCyan rounded-full mix-blend-screen filter blur-[80px] opacity-30 animate-pulse"></div>
                    <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-neonBlue rounded-full mix-blend-screen filter blur-[80px] opacity-30 animate-pulse" style="animation-delay: 1s;"></div>

                    <div class="text-center mb-8 relative z-10">
                        <div class="mx-auto w-24 h-24 mb-4 relative animate-float">
                            <div class="absolute inset-0 bg-white rounded-full blur-xl opacity-20"></div>
                            <img src="logo.jpg" alt="Logo" class="relative w-full h-full object-cover rounded-full drop-shadow-[0_0_15px_rgba(0,240,255,0.6)] border-2 border-neonCyan/50" onerror="this.src='https://placehold.co/100x100/0f172a/00F0FF?text=OSIS'">
                        </div>
                        <h2 class="text-3xl font-display font-bold text-white tracking-wide">DIGI-VOTE OSIS</h2>
                        <p class="text-sm text-neonCyan font-mono mt-2 flex items-center justify-center">
                            <span class="w-2 h-2 rounded-full bg-neonCyan animate-ping mr-2"></span> Portal Demokrasi Aman
                        </p>
                    </div>

                    <div class="flex mb-8 bg-gray-900/50 p-1 rounded-xl border border-glassBorder relative z-10">
                        <button onclick="switchLoginTab('siswa')" id="tab-siswa" class="w-1/3 py-2 rounded-lg bg-white/10 text-white font-medium text-sm transition-all shadow-[0_0_10px_rgba(255,255,255,0.1)]">Siswa</button>
                        <button onclick="switchLoginTab('guru')" id="tab-guru" class="w-1/3 py-2 rounded-lg text-gray-400 font-medium hover:text-white text-sm transition-all">Guru</button>
                        <button onclick="switchLoginTab('admin')" id="tab-admin" class="w-1/3 py-2 rounded-lg text-gray-400 font-medium hover:text-white text-sm transition-all">Admin</button>
                    </div>

                    <div id="login-error" class="hidden mb-6 p-4 bg-red-900/40 text-red-300 rounded-xl text-sm border border-red-500/50 flex items-center space-x-3 backdrop-blur-md relative z-10">
                        <i data-lucide="shield-alert" class="w-5 h-5 flex-shrink-0 text-red-400"></i>
                        <span id="error-message" class="font-mono text-xs"></span>
                    </div>

                    <form id="login-form-siswa" class="space-y-6 block relative z-10">
                        <div class="space-y-1">
                            <label class="block text-xs font-mono text-gray-400 uppercase tracking-wider">Identitas Siswa (NIS)</label>
                            <div class="relative glow-border rounded-xl">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i data-lucide="scan-line" class="w-5 h-5 text-neonCyan"></i>
                                </div>
                                <input type="text" id="nis" required class="pl-12 block w-full rounded-xl bg-gray-900/60 border border-glassBorder text-white py-3 focus:outline-none font-mono" placeholder="Masukkan NIS">
                            </div>
                        </div>
                        <button type="submit" class="w-full py-3.5 px-4 rounded-xl font-display font-bold text-black bg-gradient-to-r from-neonCyan to-blue-400 hover:from-white hover:to-neonCyan transition-all shadow-[0_0_20px_rgba(0,240,255,0.4)]">
                            MASUK & MULAI MEMILIH <i data-lucide="chevron-right" class="w-5 h-5 ml-2 inline"></i>
                        </button>
                    </form>

                    <div id="login-form-guru" class="hidden space-y-4 relative z-10">
                        <div class="bg-gray-900/80 p-4 rounded-xl border border-glassBorder text-center">
                            <div class="relative w-full overflow-hidden rounded-lg mb-2 border border-neonCyan/30 p-1 min-h-[200px] flex items-center justify-center bg-black/50">
                                <div id="qr-reader" class="w-full"></div>
                                <div id="camera-placeholder" class="text-xs text-gray-400 p-4">Klik tombol di bawah untuk mengaktifkan kamera scanner QR.</div>
                            </div>
                            <div class="flex gap-2">
                                <button type="button" onclick="initQrScanner()" class="w-1/2 py-2.5 bg-neonCyan/20 border border-neonCyan text-neonCyan font-mono text-xs font-bold rounded-lg hover:bg-neonCyan hover:text-black transition-all">MULAI KAMERA</button>
                                <label class="w-1/2 py-2.5 bg-blue-600/20 border border-blue-500 text-blue-300 font-mono text-xs font-bold rounded-lg hover:bg-blue-600 hover:text-white transition-all cursor-pointer flex items-center justify-center">
                                    <span>UPLOAD FOTO QR</span>
                                    <input type="file" accept="image/*" class="hidden" onchange="scanQrFromFile(this)">
                                </label>
                            </div>
                        </div>
                        <div class="mt-4 pt-4 border-t border-glassBorder">
                           <p class="text-[11px] text-gray-400 mb-2 font-mono">Atau masukkan token guru secara manual:</p>
                           <div class="flex space-x-2">
                                <input type="text" id="manual-qr-token" class="block w-full rounded-lg bg-gray-900/60 border border-glassBorder text-white p-2.5 text-sm font-mono focus:border-neonCyan focus:outline-none" placeholder="QRGURU-XXX">
                                <button type="button" onclick="processQR(document.getElementById('manual-qr-token').value)" class="bg-glassBorder text-white px-4 py-2.5 rounded-lg text-sm hover:bg-neonCyan hover:text-black font-bold transition-all border border-glassBorder">Masuk</button>
                           </div>
                        </div>
                    </div>

                    <form id="login-form-admin" class="hidden space-y-5 relative z-10">
                        <div class="space-y-1">
                            <label class="block text-xs font-mono text-gray-400 uppercase tracking-wider">Username KPO</label>
                            <div class="relative glow-border rounded-xl">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i data-lucide="shield" class="w-5 h-5 text-gold"></i></div>
                                <input type="text" id="admin-user" required class="pl-12 block w-full rounded-xl bg-gray-900/60 border border-glassBorder text-white py-3 focus:outline-none font-mono" placeholder="Username">
                            </div>
                        </div>
                        <div class="space-y-1">
                            <label class="block text-xs font-mono text-gray-400 uppercase tracking-wider">Kode Akses Rahasia</label>
                            <div class="relative glow-border rounded-xl">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i data-lucide="key" class="w-5 h-5 text-gold"></i></div>
                                <input type="password" id="admin-pass" required class="pl-12 block w-full rounded-xl bg-gray-900/60 border border-glassBorder text-white py-3 focus:outline-none font-mono" placeholder="••••••••">
                            </div>
                        </div>
                        <button type="submit" class="w-full py-3.5 px-4 rounded-xl font-display font-bold text-black bg-gradient-to-r from-gold to-yellow-600 hover:from-white hover:to-gold transition-all shadow-[0_0_15px_rgba(251,191,36,0.3)]">
                            AKSES DASHBOARD ADMIN
                        </button>
                    </form>
                </div>
            `;
            lucide.createIcons();
            document.getElementById('login-form-siswa').addEventListener('submit', handleStudentLogin);
            document.getElementById('login-form-admin').addEventListener('submit', handleAdminLogin);
        }

        let html5QrcodeScanner = null;

        function switchLoginTab(tab) {
            ['siswa', 'guru', 'admin'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                const form = document.getElementById(`login-form-${t}`);
                if(t === tab) {
                    btn.className = "w-1/3 py-2 rounded-lg bg-white/10 text-white font-medium text-sm transition-all shadow-[0_0_10px_rgba(255,255,255,0.1)] border border-white/20";
                    form.classList.remove('hidden');
                } else {
                    btn.className = "w-1/3 py-2 rounded-lg text-gray-500 font-medium hover:text-gray-300 text-sm transition-all border border-transparent";
                    form.classList.add('hidden');
                }
            });

            document.getElementById('login-error').classList.add('hidden');
            if (tab !== 'guru') stopQrScanner();
        }

        function initQrScanner() {
            const placeholder = document.getElementById('camera-placeholder');
            if (placeholder) placeholder.style.display = 'none';

            if (!html5QrcodeScanner) {
                try {
                    html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { 
                        fps: 10, 
                        qrbox: { width: 220, height: 220 },
                        aspectRatio: 1.0
                    }, false);
                    html5QrcodeScanner.render(processQR, (err) => {});
                } catch (e) {
                    console.error("Camera Init Error:", e);
                    showLoginError("Gagal membuka kamera. Pastikan browser diizinkan atau gunakan fitur Upload Foto QR.");
                }
            }
        }

        function scanQrFromFile(inputElement) {
            if (inputElement.files && inputElement.files[0]) {
                const file = inputElement.files[0];
                const html5QrCode = new Html5Qrcode("qr-reader");
                html5QrCode.scanFile(file, true)
                    .then(decodedText => {
                        html5QrCode.clear();
                        processQR(decodedText);
                    })
                    .catch(err => {
                        showLoginError("QR Code tidak terbaca dari foto. Coba pilih foto QR Code yang lebih jelas.");
                    });
            }
        }

        function stopQrScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().catch(e => console.error(e));
                html5QrcodeScanner = null;
            }
        }

        function renderVoting() {
            const status = getStatus();
            let userDisplay = currentUser.role === 'guru' ? `ID: ${currentUser.name}` : `NIS: ${currentUser.nis}`;

            navActions.innerHTML = `
                <div class="flex items-center space-x-4 bg-gray-900/80 rounded-full py-1.5 px-4 border border-glassBorder shadow-inner">
                    <div class="flex items-center space-x-2">
                        <div class="w-2 h-2 rounded-full bg-neonCyan animate-pulse"></div>
                        <span class="text-xs font-mono text-gray-300 hidden sm:block">${userDisplay}</span>
                    </div>
                    <div class="w-px h-4 bg-glassBorder"></div>
                    <button onclick="logout()" class="text-xs font-bold text-red-400 hover:text-red-300 transition-colors uppercase tracking-wider">DISKONEK</button>
                </div>
            `;
            
            if (status !== 'open') {
                appContainer.innerHTML = `<div class="text-center p-10 glass-card rounded-3xl w-full max-w-lg fade-in border-t-4 border-red-500"><h2 class="text-3xl font-display font-bold text-white mb-3">SISTEM DIKUNCI SEMENTARA</h2><p class="text-gray-400 mb-6 font-mono text-sm">Pemilihan sedang ditutup atau dijeda oleh administrator.</p><button onclick="logout()" class="px-6 py-3 rounded-xl border border-glassBorder text-white hover:bg-white/10 mt-4">KEMBALI</button></div>`;
                return;
            }

            const candidates = getCandidates();
            let cardsHTML = '';

            candidates.forEach((c, index) => {
                cardsHTML += `
                    <div class="glass-card rounded-3xl overflow-hidden flex flex-col slide-up group hover:border-neonCyan/50 hover:shadow-[0_0_30px_rgba(0,240,255,0.15)] transition-all duration-500" style="animation-delay: ${index * 100}ms">
                        <div class="relative h-64 bg-gray-900 overflow-hidden border-b border-glassBorder">
                            <img src="${c.photo}" alt="Foto ${c.chairman}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-105 transition-all duration-700" onerror="this.src='https://placehold.co/400x500/0f172a/00F0FF?text=Paslon+${c.number}'">
                            <div class="absolute top-4 left-4 bg-black/60 backdrop-blur-md text-white w-14 h-14 flex items-center justify-center rounded-2xl font-display font-bold text-2xl border border-white/20">${c.number}</div>
                        </div>
                        <div class="p-6 flex-grow flex flex-col">
                            <h3 class="text-2xl font-display font-bold text-white mb-1 group-hover:text-neonCyan transition-colors">${c.chairman}</h3>
                            <h4 class="text-sm font-mono text-gray-400 uppercase tracking-widest border-b border-glassBorder pb-3">& ${c.viceChairman}</h4>
                            <p class="text-sm italic text-gray-300 my-4 flex-grow border-l-2 border-neonCyan pl-3 bg-white/5 rounded-r-lg">"${c.slogan}"</p>
                            
                            <div class="space-y-3 mt-auto">
                                <button onclick="showModal(${c.id})" class="w-full py-3 border border-glassBorder text-white font-mono text-sm rounded-xl hover:bg-white/10 transition-all flex items-center justify-center"><i data-lucide="cpu" class="w-4 h-4 mr-2 text-neonCyan"></i> DEKRIPSI VISI & MISI</button>
                                <button onclick="confirmVote(${c.id})" class="w-full py-3 bg-neonCyan text-black font-display font-bold text-lg rounded-xl hover:bg-white transition-all shadow-[0_0_15px_rgba(0,240,255,0.4)] flex items-center justify-center"><i data-lucide="check-square" class="w-5 h-5 mr-2"></i> EKSEKUSI PILIHAN</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            appContainer.innerHTML = `
                <div class="w-full max-w-7xl">
                    <div class="text-center mb-12 slide-up"><h1 class="text-4xl font-display font-black text-white drop-shadow-[0_0_10px_rgba(0,240,255,0.3)] mb-3">OTORISASI PEMILIHAN</h1><p class="text-gray-400 font-mono text-sm uppercase">Pilih calon pemimpin masa depan SMANIS dengan bijak.</p></div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 relative z-10">${cardsHTML}</div>
                </div>
                <div id="vm-modal" class="fixed inset-0 bg-black/80 backdrop-blur-xl z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity"><div class="glass-card rounded-3xl border border-neonCyan/30 w-full max-w-3xl max-h-[90vh] overflow-hidden flex flex-col transform scale-95 transition-transform" id="vm-modal-content"></div></div>
                <div id="confirm-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity"><div class="glass-card border border-red-500/50 rounded-3xl max-w-md w-full p-8 text-center transform scale-95 transition-transform" id="confirm-modal-content"></div></div>
            `;
            lucide.createIcons();
        }

        function showModal(id) {
            const candidate = getCandidates().find(c => c.id === id);
            const modal = document.getElementById('vm-modal');
            const content = document.getElementById('vm-modal-content');
            
            let missionsHTML = candidate.mission.map(m => `<li class="flex items-start mb-3 bg-gray-900/50 p-3 rounded-lg border border-glassBorder"><i data-lucide="chevron-right" class="w-5 h-5 text-neonCyan mr-2 flex-shrink-0"></i><span class="text-gray-200 text-sm">${m}</span></li>`).join('');

            content.innerHTML = `
                <div class="bg-gray-900/80 border-b border-neonCyan/20 px-6 py-5 flex justify-between items-center z-10 sticky top-0 backdrop-blur-md">
                    <div class="flex items-center space-x-3"><div class="w-10 h-10 rounded-lg bg-neonCyan text-black flex items-center justify-center font-bold text-xl">${candidate.number}</div><h2 class="text-xl font-display font-bold text-white uppercase tracking-wider">Detail Visi & Misi</h2></div>
                    <button onclick="closeModal('vm-modal')" class="text-gray-400 hover:text-white p-2"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="p-6 sm:p-8 overflow-y-auto custom-scrollbar">
                    <div class="flex flex-col sm:flex-row items-center gap-8 mb-8 border-b border-glassBorder pb-8">
                        <img src="${candidate.photo}" alt="Foto" class="w-32 h-32 rounded-2xl object-cover border border-neonCyan/50 shadow-xl" onerror="this.src='https://placehold.co/200x200/0f172a/00F0FF?text=Paslon'">
                        <div class="text-center sm:text-left flex-grow"><h3 class="text-3xl font-display font-bold text-white">${candidate.chairman}</h3><h4 class="text-lg font-mono text-gray-400 mb-4">& ${candidate.viceChairman}</h4><p class="text-sm font-mono bg-neonCyan/10 text-neonCyan py-2 px-4 rounded-lg inline-block border border-neonCyan/30">"${candidate.slogan}"</p></div>
                    </div>
                    <div class="space-y-8">
                        <div><h5 class="font-display font-bold text-xl text-white mb-3 flex items-center border-l-4 border-neonCyan pl-3 uppercase">Visi Utama</h5><p class="bg-gray-900/60 p-5 rounded-xl border border-glassBorder text-gray-300">${candidate.vision}</p></div>
                        <div><h5 class="font-display font-bold text-xl text-white mb-3 flex items-center border-l-4 border-blue-500 pl-3 uppercase">Misi & Program Kerja</h5><ul>${missionsHTML}</ul></div>
                    </div>
                </div>
                <div class="p-6 border-t border-glassBorder bg-gray-900/80 flex justify-end"><button onclick="confirmVote(${candidate.id})" class="py-3 px-8 bg-neonCyan text-black font-display font-bold rounded-xl hover:bg-white flex items-center">PILIH PASLON ${candidate.number} <i data-lucide="arrow-right" class="w-5 h-5 ml-2"></i></button></div>
            `;
            lucide.createIcons();
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.add('opacity-0'); modal.children[0].classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300); 
        }

        function confirmVote(id) {
            if(!document.getElementById('vm-modal').classList.contains('hidden')) closeModal('vm-modal');
            const candidate = getCandidates().find(c => c.id === id);
            const modal = document.getElementById('confirm-modal');
            const content = document.getElementById('confirm-modal-content');

            content.innerHTML = `
                <div class="absolute top-0 left-0 w-full h-1 bg-red-500"></div>
                <i data-lucide="alert-triangle" class="h-16 w-16 text-red-500 mx-auto mb-4 animate-pulse"></i>
                <h3 class="text-2xl font-display font-bold text-white mb-2 uppercase tracking-widest">Konfirmasi Pilihan</h3>
                <p class="text-sm text-gray-300 mb-8 font-mono">Anda akan mengunci pilihan untuk <br><span class="text-xl font-display font-bold text-neonCyan my-2 block">PASLON NO. ${candidate.number} (${candidate.chairman})</span><span class="text-red-400">Pilihan bersifat permanen dan tidak dapat diubah kembali.</span></p>
                <div class="flex gap-3"><button onclick="closeModal('confirm-modal')" class="w-full py-3 border border-glassBorder text-white rounded-xl">Batalkan</button><button onclick="submitVote(${candidate.id})" class="w-full py-3 bg-red-500 text-white font-bold rounded-xl shadow-[0_0_15px_rgba(239,68,68,0.5)]">KUNCI PILIHAN</button></div>
            `;
            lucide.createIcons();
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
        }

        function submitVote(candidateId) {
            let results = getResults();
            results[candidateId] = (results[candidateId] || 0) + 1;
            localStorage.setItem('evote_results', JSON.stringify(results));

            let voters = getVoters();
            let voterIndex = currentUser.role === 'siswa' ? voters.findIndex(v => v.nis === currentUser.nis) : voters.findIndex(v => v.token === currentUser.token);
            if(voterIndex > -1) { voters[voterIndex].hasVoted = true; localStorage.setItem('evote_voters', JSON.stringify(voters)); }
            
            renderView('success', { receiptId: 'TRX-' + Math.random().toString(36).substring(2, 9).toUpperCase(), timestamp: new Date().toLocaleString('id-ID') });
        }

        function renderSuccess(data) {
            navActions.innerHTML = '';
            appContainer.innerHTML = `
                <div class="glass-card p-10 rounded-3xl w-full max-w-lg text-center fade-in slide-up border-t-4 border-neonCyan shadow-[0_0_40px_rgba(0,240,255,0.15)]">
                    <i data-lucide="check-circle" class="h-20 w-20 text-neonCyan mx-auto mb-6 drop-shadow-[0_0_15px_rgba(0,240,255,0.8)]"></i>
                    <h2 class="text-3xl font-display font-bold text-white mb-2 uppercase">Suara Berhasil Direkam</h2>
                    <p class="text-gray-400 mb-8 font-mono text-sm">Data voting Anda telah terenkripsi dengan aman ke sistem.</p>
                    <div class="bg-gray-900/60 rounded-xl p-5 text-sm text-left mb-8 border border-glassBorder font-mono">
                        <div class="flex justify-between border-b border-glassBorder py-2"><span class="text-gray-400">ID Pemilih</span> <span class="font-bold text-white">${currentUser.nis || currentUser.name}</span></div>
                        <div class="flex justify-between border-b border-glassBorder py-2"><span class="text-gray-400">Waktu</span> <span class="font-bold text-white">${data.timestamp}</span></div>
                        <div class="flex justify-between pt-2"><span class="text-gray-400">Resi Hash</span> <span class="font-bold text-neonCyan">${data.receiptId}</span></div>
                    </div>
                    <button onclick="logout()" class="w-full py-4 border border-glassBorder rounded-xl text-white hover:bg-white/10 transition-colors uppercase font-bold text-sm">SELESAI & KELUAR</button>
                    <p class="mt-4 text-xs font-mono text-gray-500">Sesi akan otomatis ditutup dalam <span id="countdown" class="text-neonCyan font-bold">10</span> detik...</p>
                </div>
            `;
            lucide.createIcons();
            let seconds = 10;
            const timer = setInterval(() => { seconds--; const el = document.getElementById('countdown'); if(el) el.textContent = seconds; if(seconds <= 0) { clearInterval(timer); logout(); } }, 1000);
            currentUser = null;
        }

        function renderAlreadyVoted() {
            appContainer.innerHTML = `<div class="glass-card p-10 rounded-3xl w-full max-w-md text-center fade-in border-t-4 border-red-500"><i data-lucide="shield-alert" class="h-20 w-20 text-red-500 mx-auto mb-6"></i><h2 class="text-2xl font-display font-bold text-white mb-3 uppercase">Akses Ditolak</h2><p class="text-gray-400 mb-8 font-mono text-sm">Identitas ini telah digunakan untuk melakukan voting. Sistem mencegah pemilihan ganda.</p><button onclick="logout()" class="w-full py-3 bg-red-500/20 border border-red-500/50 text-red-300 font-bold rounded-xl">KEMBALI KE LOGIN</button></div>`;
            lucide.createIcons();
        }

        function renderAdmin() {
            navActions.innerHTML = `<div class="flex items-center space-x-4"><span class="text-xs font-mono text-gold border border-gold/30 px-3 py-1 rounded-full bg-gold/10 uppercase hidden sm:block">Admin KPO Aktif</span><button onclick="logout()" class="flex items-center text-xs font-bold text-white bg-red-500/80 px-4 py-2 rounded-lg"><i data-lucide="power" class="w-4 h-4 mr-2"></i> TERMINASI</button></div>`;

            appContainer.innerHTML = `
                <div class="w-full max-w-7xl mx-auto space-y-6 slide-up pb-10">
                    <div class="flex flex-col md:flex-row justify-between md:items-center glass-card p-6 rounded-3xl gap-4">
                        <div><h1 class="text-3xl font-display font-bold text-white uppercase tracking-wider">Pusat Komando KPO</h1><p class="text-sm font-mono text-neonCyan">Monitor Telemetri & Quick Count Real-time</p></div>
                        <select id="status-control" onchange="updateStatus(this.value)" class="bg-black/50 border border-neonCyan/50 text-white font-mono text-sm rounded-lg p-2 outline-none">
                            <option value="open">🟢 ONLINE (PEMILIHAN DIBUKA)</option><option value="paused">🟡 STANDBY (DIJEDA)</option><option value="closed">🔴 OFFLINE (DITUTUP)</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="admin-metrics"></div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="glass-card p-6 rounded-3xl lg:col-span-1 border-t-4 border-neonBlue flex flex-col h-full">
                            <h3 class="text-lg font-display font-bold text-white mb-6 flex items-center"><i data-lucide="server" class="w-5 h-5 mr-3 text-neonBlue"></i> DISTRIBUSI SUARA</h3>
                            <div id="admin-leaderboard" class="space-y-5 flex-grow"></div>
                        </div>
                        <div class="glass-card p-6 rounded-3xl lg:col-span-2 border-t-4 border-neonCyan flex flex-col">
                             <div class="flex justify-between items-center mb-4">
                                <h3 class="text-lg font-display font-bold text-white flex items-center"><i data-lucide="bar-chart-2" class="w-5 h-5 mr-3 text-neonCyan"></i> ANALISIS TELEMETRI</h3>
                                <div class="flex bg-gray-900/80 p-1 rounded-xl border border-glassBorder space-x-1">
                                    <button onclick="setChartType('bar')" id="btn-chart-bar" class="px-3 py-1.5 rounded-lg bg-neonCyan text-black font-mono text-xs font-bold transition-all">Batang</button>
                                    <button onclick="setChartType('doughnut')" id="btn-chart-doughnut" class="px-3 py-1.5 rounded-lg text-gray-400 font-mono text-xs font-bold hover:text-white transition-all">Bulat</button>
                                </div>
                             </div>
                            <div class="relative flex-grow min-h-[350px] w-full flex justify-center items-center"><canvas id="mainChart"></canvas></div>
                        </div>
                    </div>

                    <div class="glass-card p-6 rounded-3xl border-t-4 border-gold bg-gradient-to-br from-gray-900 to-black relative overflow-hidden">
                        <div class="absolute -right-20 -bottom-20 w-64 h-64 bg-gold rounded-full mix-blend-screen filter blur-[100px] opacity-10 pointer-events-none"></div>
                        <div class="flex flex-col md:flex-row justify-between items-center gap-6 relative z-10">
                            <div>
                                <h3 class="text-xl font-display font-bold text-white flex items-center mb-2"><i data-lucide="qr-code" class="w-6 h-6 mr-3 text-gold"></i> GENERATOR TOKEN GURU</h3>
                                <p class="text-sm font-mono text-gray-400">Buat token & QR Code baru secara instan untuk pemilih guru. Token yang dibuat otomatis aktif dan valid satu kali pakai.</p>
                            </div>
                            <button onclick="generateNewToken()" class="flex-shrink-0 px-6 py-3 bg-gradient-to-r from-gold to-yellow-600 text-black font-display font-bold rounded-xl shadow-[0_0_15px_rgba(251,191,36,0.3)] hover:scale-105 transition-transform flex items-center">
                                <i data-lucide="plus" class="w-5 h-5 mr-2"></i> BUAT TOKEN BARU
                            </button>
                        </div>
                        
                        <div id="qr-result-container" class="mt-8 pt-8 border-t border-glassBorder hidden text-center">
                            <div id="generated-qr" class="inline-block"></div>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
            document.getElementById('status-control').value = getStatus();
            updateAdminData();
            window.adminInterval = setInterval(updateAdminData, 3000);
        }

        let mainChartInstance = null;
        let currentChartType = 'bar';

        function setChartType(type) {
            currentChartType = type;
            const btnBar = document.getElementById('btn-chart-bar');
            const btnDoughnut = document.getElementById('btn-chart-doughnut');
            
            if (type === 'bar') {
                btnBar.className = "px-3 py-1.5 rounded-lg bg-neonCyan text-black font-mono text-xs font-bold transition-all";
                btnDoughnut.className = "px-3 py-1.5 rounded-lg text-gray-400 font-mono text-xs font-bold hover:text-white transition-all";
            } else {
                btnDoughnut.className = "px-3 py-1.5 rounded-lg bg-neonCyan text-black font-mono text-xs font-bold transition-all";
                btnBar.className = "px-3 py-1.5 rounded-lg text-gray-400 font-mono text-xs font-bold hover:text-white transition-all";
            }
            updateAdminData();
        }

        const percentageLabelPlugin = {
            id: 'percentageLabelPlugin',
            afterDatasetsDraw(chart) {
                if (chart.config.type !== 'doughnut') return;
                const { ctx } = chart;
                chart.data.datasets.forEach((dataset, datasetIndex) => {
                    const meta = chart.getDatasetMeta(datasetIndex);
                    if (!meta.hidden) {
                        meta.data.forEach((element, index) => {
                            const dataVal = dataset.data[index];
                            const total = dataset.data.reduce((a, b) => a + b, 0);
                            const percentage = total > 0 ? ((dataVal / total) * 100).toFixed(1) + '%' : '0%';
                            
                            if (parseFloat(percentage) > 3) {
                                const { x, y } = element.tooltipPosition();
                                ctx.save();
                                ctx.font = 'bold 14px Inter, sans-serif';
                                ctx.fillStyle = '#ffffff';
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                                ctx.shadowBlur = 8;
                                ctx.fillText(percentage, x, y);
                                ctx.restore();
                            }
                        });
                    }
                });
            }
        };

        function updateAdminData() {
            if(!document.getElementById('mainChart')) { clearInterval(window.adminInterval); return; }

            const candidates = getCandidates();
            const voters = getVoters().filter(v => v.role !== 'admin');
            const results = getResults();

            const totalDPT = voters.length;
            const totalVoted = voters.filter(v => v.hasVoted).length;
            const turnout = totalDPT > 0 ? ((totalVoted / totalDPT) * 100).toFixed(1) : 0;
            const totalCandidateVotes = Object.values(results).reduce((a, b) => a + b, 0);

            const metrics = [
                { title: 'TOTAL DPT', val: totalDPT, icon: 'users', color: 'text-blue-400', border: 'border-blue-500/50' },
                { title: 'SUARA MASUK', val: totalVoted, icon: 'download', color: 'text-neonCyan', border: 'border-neonCyan' },
                { title: 'PARTISIPASI', val: turnout+'%', icon: 'activity', color: 'text-emerald-400', border: 'border-emerald-500/50' },
                { title: 'SISA DPT', val: Math.max(0, totalDPT - totalVoted), icon: 'clock', color: 'text-orange-400', border: 'border-orange-500/50' }
            ];

            const metricsEl = document.getElementById('admin-metrics');
            if (metricsEl) {
                metricsEl.innerHTML = metrics.map(m => `
                    <div class="glass-card p-5 rounded-2xl flex justify-between border-l-4 ${m.border}">
                        <div><p class="text-[10px] font-mono text-gray-400 uppercase tracking-widest mb-1">${m.title}</p><h4 class="text-3xl font-display font-bold text-white drop-shadow-[0_0_8px_rgba(255,255,255,0.3)]">${m.val}</h4></div>
                        <div class="p-3 rounded-xl bg-white/5 border border-glassBorder ${m.color} opacity-80"><i data-lucide="${m.icon}" class="w-6 h-6"></i></div>
                    </div>
                `).join('');
                lucide.createIcons();
            }

            const colors = ['bg-blue-500', 'bg-gold', 'bg-emerald-500', 'bg-purple-500'];
            
            const leaderboardEl = document.getElementById('admin-leaderboard');
            if (leaderboardEl) {
                leaderboardEl.innerHTML = candidates.map((c, i) => {
                    const votes = results[c.id] || 0;
                    const pct = totalCandidateVotes > 0 ? ((votes / totalCandidateVotes) * 100).toFixed(1) : 0;
                    return `
                        <div class="mb-2">
                            <div class="flex justify-between items-end mb-2">
                                <div><span class="text-xs font-mono text-gray-400">PASLON 0${c.number}</span><p class="text-sm font-bold text-white">${c.chairman}</p></div>
                                <div class="text-right"><span class="text-lg font-bold text-white">${votes}</span> <span class="text-xs font-mono text-gray-400 ml-1">[ ${pct}% ]</span></div>
                            </div>
                            <div class="w-full bg-gray-900/80 rounded-full h-2.5 border border-glassBorder"><div class="${colors[i]} h-full rounded-full transition-all duration-1000" style="width: ${pct}%"></div></div>
                        </div>
                    `;
                }).join('');
            }

            const ctx = document.getElementById('mainChart').getContext('2d');
            if(mainChartInstance) mainChartInstance.destroy();
            
            mainChartInstance = new Chart(ctx, {
                type: currentChartType,
                data: {
                    labels: candidates.map(c => `Paslon 0${c.number}`),
                    datasets: [{
                        label: 'Perolehan Suara',
                        data: candidates.map(c => results[c.id] || 0),
                        backgroundColor: ['#3B82F6', '#FBBF24', '#10B981', '#A855F7'],
                        borderRadius: currentChartType === 'bar' ? 4 : 0,
                        borderWidth: currentChartType === 'doughnut' ? 2 : 0,
                        borderColor: '#030712'
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: currentChartType === 'doughnut', position: 'bottom', labels: { color: '#e5e7eb', font: { family: 'Outfit', size: 12 } } } 
                    },
                    scales: currentChartType === 'bar' ? {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#9ca3af', stepSize: 1 } },
                        x: { grid: { display: false }, ticks: { color: '#e5e7eb', font: {family: 'Outfit', weight: 'bold'} } }
                    } : {}
                },
                plugins: [percentageLabelPlugin]
            });
        }

        window.generateNewToken = function() {
            const randomStr = Math.random().toString(36).substring(2, 6).toUpperCase();
            const newToken = `QRGURU-${randomStr}`;
            
            const newVoter = { token: newToken, role: "guru", name: `Guru ID: ${randomStr}`, hasVoted: false };
            let voters = getVoters();
            voters.push(newVoter);
            localStorage.setItem('evote_voters', JSON.stringify(voters));

            const container = document.getElementById('qr-result-container');
            const qrTarget = document.getElementById('generated-qr');
            
            qrTarget.innerHTML = `
                <div class="bg-white p-4 rounded-xl inline-block relative border-4 border-neonCyan shadow-[0_0_20px_rgba(0,240,255,0.5)] transition-all" id="qr-capture-area">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${newToken}&color=030712" alt="QR Token" class="w-48 h-48 mb-3" crossorigin="anonymous">
                    <p class="text-black font-mono font-bold text-center text-xl tracking-widest bg-gray-100 py-1.5 rounded">${newToken}</p>
                    <div class="absolute -top-3 -right-3 bg-neonCyan text-black text-[10px] font-bold px-2 py-1 rounded-full uppercase shadow-lg">Valid</div>
                </div>
                <div class="mt-6 flex flex-col items-center space-y-3">
                    <p class="text-sm text-gray-300 font-mono">Status: <span class="text-neonCyan font-bold">AKTIF & TERSIMPAN</span></p>
                    <button onclick="downloadQR('${newToken}')" class="flex items-center px-5 py-2.5 bg-neonCyan text-black font-bold font-display rounded-lg hover:bg-white transition shadow-[0_0_10px_rgba(0,240,255,0.5)]">
                        <i data-lucide="download" class="w-5 h-5 mr-2"></i> Unduh QR (PNG)
                    </button>
                    <p class="text-[10px] text-gray-500 mt-2 max-w-xs">Gunakan tombol unduh untuk menyimpan gambar QR code siap cetak.</p>
                </div>
            `;
            container.classList.remove('hidden');
            lucide.createIcons();
            updateAdminData();
        }

        window.downloadQR = function(tokenStr) {
            const element = document.getElementById('qr-capture-area');
            setTimeout(() => {
                html2canvas(element, { backgroundColor: null, useCORS: true }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `Token-${tokenStr}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
            }, 500); 
        }

        function updateStatus(newStatus) { localStorage.setItem('evote_status', newStatus); }

        function handleStudentLogin(e) {
            e.preventDefault();
            const nis = document.getElementById('nis').value.trim();
            const user = getVoters().find(v => v.nis === nis && v.role === 'siswa');
            proceedLogin(user, "NIS tidak terdeteksi dalam database DPT.");
        }

        function processQR(decodedText) {
            if(!decodedText) return;
            const user = getVoters().find(v => v.token === decodedText && v.role === 'guru');
            proceedLogin(user, "Token QR tidak valid atau sudah digunakan.");
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const userField = document.getElementById('admin-user').value.trim();
            const passField = document.getElementById('admin-pass').value.trim();
            const user = getVoters().find(v => v.role === 'admin' && v.username === userField && v.pin === passField);
            proceedLogin(user, "Kredensial Admin KPO Salah.");
        }

        function proceedLogin(user, failMessage) {
            const errorDiv = document.getElementById('login-error');
            if (user) {
                currentUser = user; 
                errorDiv.classList.add('hidden');
                stopQrScanner();
                
                if (user.role === 'admin') renderView('admin');
                else if (user.hasVoted) renderView('already_voted');
                else renderView('voting');
            } else {
                document.getElementById('error-message').textContent = failMessage;
                errorDiv.classList.remove('hidden');
            }
        }

        function logout() {
            currentUser = null;
            if(window.adminInterval) clearInterval(window.adminInterval);
            stopQrScanner();
            renderView('login');
        }

        renderView('login');
    </script>
</body>
</html>
